[package]
name = "claudius-chat"
description = "The chat transcript (U05): the React message list's row decisions as a pure model over claudius-client's ChatState, and its GPUI view"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The message stamps' local time (`formatMessageTime`).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
claudius-client.workspace = true
# `js_date` / `js_num`, the JS emulation the client already pins.
claudius-core.workspace = true
claudius-gpui-theme.workspace = true
claudius-theme.workspace = true
futures = "0.3"
gpui-kit.workspace = true
# The client's `goal_uuids` / `suggested_uuids` sets.
indexmap = "2"
serde_json.workspace = true

[dev-dependencies]
anyhow = "1"
# The bench's per-thread CPU clock (`CLOCK_THREAD_CPUTIME_ID`), as U00a's.
libc = "0.2"
# The screenshot example's PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }
# `TestAppContext` and `VisualTestContext` (as claudius-app's tests).
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# CoreText (real glyph widths) and the offscreen Metal renderer.
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.12", features = ["font-kit", "test-support"] }
