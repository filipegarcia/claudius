[package]
name = "claudius-panels"
description = "The chat's right rail and goal banner (U09b): BackgroundTasksPanel.tsx with its widgets (SessionCard, PlanUsageCard, TodoList, AddTodosForm, ScheduledLoops, BackgroundBashes, RecentEdits, ...) and GoalBanner.tsx, as a pure model over claudius-client's ChatState and GPUI views"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `formatReset`'s / the stale card's local time ("Sun 3:00 AM").
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `js::number_to_string` (a template's `${n}`), `js::truthy`.
claudius-agent.workspace = true
# `locale_number` (`toLocaleString()`).
claudius-chat.workspace = true
claudius-client.workspace = true
# `now_ms`, the JS string helpers.
claudius-core.workspace = true
claudius-gpui-theme.workspace = true
# The SessionCard's ModelPicker is the status line's (U09a): the card opens
# its popover; `to_fixed`, `StatusTarget`.
claudius-status.workspace = true
claudius-theme.workspace = true
futures = "0.3"
gpui-kit.workspace = true
# The rail's ordered sets (the Stop-all ids, the usage windows by key).
indexmap = "2"
serde_json.workspace = true

[dev-dependencies]
anyhow = "1"
# The screenshot example's PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }
# `TestAppContext` and `VisualTestContext` (as claudius-app's tests).
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# CoreText (real glyph widths) and the offscreen Metal renderer.
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.12", features = ["font-kit", "test-support"] }
