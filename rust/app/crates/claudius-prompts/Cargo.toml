[package]
name = "claudius-prompts"
description = "The prompt cards (U08): permission, plan approval, MCP elicitation and AskUserQuestion, as pure form state over claudius-client's ChatState and their GPUI views"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `Number(s)`, `trim`, number text and own-key order, as the TS reads them.
claudius-agent.workspace = true
# The pending prompts and the actions that answer them (U01f).
claudius-client.workspace = true
# `js_string` (UTF-16 lengths, `JSON.stringify(v, null, 2)`) and the
# hidden-name set (`visualize_hidden_name_unicode`) and `parse_ask_questions`.
claudius-core.workspace = true
claudius-gpui-theme.workspace = true
claudius-theme.workspace = true
futures = "0.3"
gpui-kit.workspace = true
serde_json.workspace = true
# `new URL(raw)` (WHATWG), for the elicitation link.
url = "2"

[dev-dependencies]
anyhow = "1"
# `TestAppContext` and `VisualTestContext` (as claudius-app's tests).
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
# The screenshot example's PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# CoreText (real glyph widths) and the offscreen Metal renderer.
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.12", features = ["font-kit", "test-support"] }
