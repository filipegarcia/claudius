[package]
name = "claudius-app"
description = "The native app shell (U04): window, side nav, workspace switcher, session tabs and routing, over the ShellData trait"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "claudius-app"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# `readableSessionLabel`'s local date and time ("Jun 30 at 2:15 PM").
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The chat route's transcript (U05) and its `TranscriptSource`.
claudius-chat.workspace = true
claudius-agent.workspace = true
claudius-client.workspace = true
claudius-core.workspace = true
# The chat route's composer (U07).
claudius-composer.workspace = true
claudius-gpui-theme.workspace = true
claudius-server.workspace = true
claudius-theme.workspace = true
claudius-transport.workspace = true
futures = "0.3"
gpui-kit.workspace = true
# The native `localStorage` keeps keys in insertion order, as the browser.
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
# `newTabId()`'s random bytes.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
bytes = "1"
http = "1"
tempfile = "3"
# `TestAppContext`, `VisualTestContext::debug_bounds` and the headless
# window's `render_to_image` (as claudius-gpui-theme: gpui-kit's own
# `test-support` doesn't resolve).
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# CoreText (real glyph widths in the tests) and the offscreen Metal renderer
# the screenshot example draws with, which needs no Screen Recording grant.
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.12", features = ["font-kit", "test-support"] }
